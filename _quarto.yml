project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "research/**/*.qmd"
    - "papers/**/*.qmd"
  resources:
    - "research/*/thumb.png"
    - "research/*/banner.png"
    - "research/*/banner-over.png"
    - "papers/*/thumb.png"
    - "papers/*/banner.png"

website:
  title: "Reports"
  site-url: https://severynkh.github.io/Report-website/
  repo-url: https://github.com/severynKh/Report-website
  search: false
  # Top bar. It slides away when scrolling down and returns when scrolling up.
  navbar:
    title: "Severyn Khomych"
    pinned: false
    collapse: false
  page-footer:
    center: "Criticism and advice is what this website was built for: [open an issue on GitHub](https://github.com/severynKh/Report-website/issues/new)."



bibliography: references.bib

format:
  html:
    theme: [default, custom.scss]
    include-in-header:
      - _mode-toggle.html
    # "Comment on this page" link at the foot of every page.
    include-after-body: _page-issue.html
    page-layout: article
    grid:
      body-width: 700px
      sidebar-width: 0px
      margin-width: 0px
    toc: false
    link-external-newwindow: true
